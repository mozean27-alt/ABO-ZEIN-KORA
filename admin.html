<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
</head>
<body>
    <div style="background:#151c28; padding:20px; border-radius:10px; color:white; text-align:center;">
        <h2>لوحة نشر الأخبار</h2>
        <input type="text" id="title" placeholder="عنوان الخبر" style="width:90%; padding:10px; margin:10px;">
        <br>
        <button id="btn" style="background:green; color:white; padding:15px; border:none; cursor:pointer;">نشر الخبر الآن</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ضع بياناتك هنا بدقة
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_ID",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('btn').addEventListener('click', async () => {
            alert('بدأت عملية النشر...');
            const title = document.getElementById('title').value;
            try {
                await addDoc(collection(db, "news"), { title: title });
                alert('تم النشر بنجاح!');
            } catch (e) {
                alert('خطأ: ' + e.message);
            }
        });
    </script>
</body>
</html>
