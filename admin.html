<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | كورة ابوزين</title>
    <style>
        body { font-family: sans-serif; background: #0a0e17; color: white; padding: 30px; display: flex; justify-content: center; }
        .admin-card { background: #151c28; padding: 25px; border-radius: 12px; width: 100%; max-width: 500px; border: 1px solid #10b981; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #1e293b; background: #0a0e17; color: white; font-size: 1rem; box-sizing: border-box; }
        button { background: #10b981; font-weight: bold; cursor: pointer; border: none; }
    </style>
</head>
<body>
    <div class="admin-card">
        <h2>لوحة نشر الأخبار</h2>
        <input type="text" id="title" placeholder="عنوان الخبر...">
        <input type="text" id="img" placeholder="رابط الصورة...">
        <select id="category">
            <option value="local">الكرة المحلية</option>
            <option value="saudi">الدوري السعودي</option>
            <option value="global">الكرة العالمية</option>
        </select>
        <button id="publishBtn">نشر الخبر الآن</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ⚠️ ضع مفاتيحك هنا مرة أخرى بدقة
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        document.getElementById('publishBtn').addEventListener('click', async () => {
            const title = document.getElementById('title').value;
            const img = document.getElementById('img').value;
            const category = document.getElementById('category').value;

            if(!title) { alert('اكتب العنوان!'); return; }

            try {
                await addDoc(collection(db, "news"), {
                    title: title,
                    img: img,
                    category: category,
                    date: new Date()
                });
                alert('تم نشر الخبر مع الصورة والقسم بنجاح!');
            } catch (e) {
                alert('خطأ: ' + e.message);
            }
        });
    </script>
</body>
</html>
