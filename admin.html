<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | كورة ابوزين</title>
    <style>
        body { font-family: sans-serif; background: #0a0e17; color: white; padding: 30px; display: flex; flex-direction: column; align-items: center; gap: 20px; }
        .admin-card { background: #151c28; padding: 25px; border-radius: 12px; width: 100%; max-width: 600px; border: 1px solid #10b981; margin-bottom: 20px; }
        input, select, button { width: 100%; padding: 12px; margin-top: 10px; border-radius: 6px; border: 1px solid #1e293b; background: #0a0e17; color: white; font-size: 1rem; box-sizing: border-box; }
        button { background: #10b981; font-weight: bold; cursor: pointer; border: none; transition: 0.3s; }
        button:hover { opacity: 0.9; }
        h2 { font-size: 1.2rem; margin-bottom: 15px; color: #10b981; border-right: 4px solid #10b981; padding-right: 8px; }
        .row { display: flex; gap: 10px; }
    </style>
</head>
<body>

    <!-- قسم نشر الأخبار -->
    <div class="admin-card">
        <h2>لوحة نشر الأخبار</h2>
        <input type="text" id="title" placeholder="عنوان الخبر...">
        <input type="text" id="img" placeholder="رابط الصورة (اختياري)...">
        <select id="category">
            <option value="local">الكرة المحلية</option>
            <option value="global">الكرة العالمية</option>
            <option value="saudi">الدوري السعودي</option>
        </select>
        <button onclick="publishNews()">نشر الخبر فوراً</button>
    </div>

    <!-- قسم تحديث جدول الدوري -->
    <div class="admin-card">
        <h2>تحديث ترتيب ونقاط الأندية</h2>
        <select id="leagueType">
            <option value="saudi">الدوري السعودي</option>
            <option value="local">الدوري المصري</option>
        </select>
        <input type="text" id="teamName" placeholder="اسم الفريق (مثال: الهلال أو الأهلي)...">
        <div class="row">
            <input type="number" id="matchesPlayed" placeholder="عدد المباريات (لعب)">
            <input type="number" id="teamPoints" placeholder="النقاط">
        </div>
        <button style="background: #3b82f6;" onclick="updateStandings()">حفظ وتحديث جدول الفريق</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // نشر الأخبار
        window.publishNews = async function() {
            const title = document.getElementById('title').value.trim();
            const img = document.getElementById('img').value.trim() || 'https://images.unsplash.com/photo-1508098682722-e99c43a406b2?w=800&fit=crop';
            const category = document.getElementById('category').value;
            const catNames = { local: 'الكرة المحلية', global: 'الكرة العالمية', saudi: 'الدوري السعودي' };

            if(!title) return alert('أدخل العنوان!');

            try {
                await addDoc(collection(db, "news"), {
                    title, img, category, categoryName: catNames[category], timestamp: new Date()
                });
                document.getElementById('title').value = '';
                document.getElementById('img').value = '';
                alert('تم نشر الخبر بنجاح!');
            } catch (error) {
                alert('حدث خطأ في النشر!');
                console.error(error);
            }
        };

        // تحديث جدول الترتيب والنقاط
        window.updateStandings = async function() {
            const league = document.getElementById('leagueType').value;
            const team = document.getElementById('teamName').value.trim();
            const played = document.getElementById('matchesPlayed').value;
            const points = document.getElementById('teamPoints').value;

            if(!team || played === '' || points === '') {
                return alert('الرجاء إدخال اسم الفريق وعدد المباريات والنقاط!');
            }

            try {
                // حفظ بيانات الفريق في قاعدة البيانات داخل جدول خاص بالترتيب
                await setDoc(doc(db, "standings", `${league}_${team}`), {
                    league: league,
                    team: team,
                    played: Number(played),
                    points: Number(points),
                    updatedAt: new Date()
                });

                document.getElementById('teamName').value = '';
                document.getElementById('matchesPlayed').value = '';
                document.getElementById('teamPoints').value = '';
                alert('تم تحديث بيانات الفريق في جدول الدوري بنجاح!');
            } catch (error) {
                alert('حدث خطأ أثناء تحديث الجدول!');
                console.error(error);
            }
        };
    </script>
</body>
</html>
