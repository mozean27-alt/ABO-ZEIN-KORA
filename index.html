<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KORA ABO ZAIN | كورة ابوزين</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #0a0e17;
            --bg-card: #151c28;
            --bg-hover: #1e293b;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #1e293b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-main); color: var(--text-main); }

        .top-header { background: #030712; padding: 8px 30px; font-size: 0.85rem; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .live-tag { background: var(--accent-red); color: white; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 0.75rem; animation: blink 1.5s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        .main-header { background: var(--bg-card); padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--border); }
        .brand { font-size: 1.8rem; font-weight: 900; color: white; text-decoration: none; display: flex; align-items: center; gap: 8px; text-transform: uppercase; }
        .brand .kora-text { color: var(--accent-green); }

        .nav-bar { background: #0f172a; display: flex; gap: 10px; padding: 0 20px; border-bottom: 1px solid var(--border); overflow-x: auto; }
        .nav-btn { background: transparent; color: var(--text-muted); border: none; padding: 14px 22px; font-size: 1rem; font-weight: bold; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s; white-space: nowrap; }
        .nav-btn.active, .nav-btn:hover { color: var(--accent-green); border-bottom-color: var(--accent-green); background: rgba(16, 185, 129, 0.05); }

        .content-layout { display: grid; grid-template-columns: 2.8fr 1.2fr; gap: 20px; max-width: 1300px; margin: 25px auto; padding: 0 15px; }
        @media (max-width: 992px) { .content-layout { grid-template-columns: 1fr; } }

        .section-title { font-size: 1.1rem; font-weight: bold; display: flex; align-items: center; gap: 8px; border-right: 4px solid var(--accent-green); padding-right: 10px; margin-bottom: 15px; }

        .live-streams-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stream-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; padding: 15px; text-align: center; }
        .stream-card h4 { font-size: 1rem; margin-bottom: 10px; }
        .live-btn { background: var(--accent-red); color: white; padding: 8px 15px; border-radius: 6px; text-decoration: none; font-size: 0.85rem; font-weight: bold; display: inline-flex; align-items: center; gap: 6px; width: 100%; justify-content: center; }
        .live-btn:hover { opacity: 0.9; }

        .sidebar-table-box { background: var(--bg-card); border-radius: 12px; border: 1px solid var(--border); padding: 15px; max-height: 480px; display: flex; flex-direction: column; }
        .table-scroll-container { overflow-y: auto; flex-grow: 1; margin-top: 10px; padding-left: 5px; }
        .table-scroll-container::-webkit-scrollbar { width: 6px; }
        .table-scroll-container::-webkit-scrollbar-thumb { background: var(--accent-green); border-radius: 4px; }
        .table-scroll-container::-webkit-scrollbar-track { background: var(--bg-main); }

        .league-table { width: 100%; border-collapse: collapse; text-align: center; font-size: 0.85rem; }
        .league-table th, .league-table td { padding: 10px 6px; border-bottom: 1px solid var(--border); }
        .league-table th { background: #0f172a; color: var(--text-muted); font-size: 0.75rem; position: sticky; top: 0; }
        .league-table tr:hover { background: var(--bg-hover); }
        .team-name { text-align: right; font-weight: bold; }

        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .news-card { background: var(--bg-card); border-radius: 12px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
        .news-img-wrapper { width: 100%; height: 160px; overflow: hidden; background: #0f172a; }
        .news-card img { width: 100%; height: 100%; object-fit: cover; }
        .news-content { padding: 15px; }
        .news-tag { color: var(--accent-green); font-size: 0.75rem; font-weight: bold; display: block; margin-bottom: 5px; }
        .news-card-title { font-size: 0.9rem; font-weight: bold; line-height: 1.5; color: var(--text-main); }
        .status-msg { text-align: center; color: var(--text-muted); padding: 30px; grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="top-header">
        <div><span class="live-tag">مباشر</span> كورة ابوزين - البث المباشر وجدول الترتيب</div>
        <div>تغطية حصرية</div>
    </div>

    <header class="main-header">
        <a href="#" class="brand">
            <i class="fa-solid fa-trophy" style="color: var(--accent-green);"></i>
            <span class="kora-text">KORA</span> ABO ZAIN
        </a>
    </header>

    <nav class="nav-bar">
        <button class="nav-btn active" onclick="loadCategory('local', this)"><i class="fa-solid fa-fire"></i> الكرة المحلية</button>
        <button class="nav-btn" onclick="loadCategory('saudi', this)"><i class="fa-solid fa-crown"></i> الدوري السعودي</button>
        <button class="nav-btn" onclick="loadCategory('global', this)"><i class="fa-solid fa-globe"></i> الكرة العالمية</button>
    </nav>

    <div class="content-layout">
        
        <main>
            <div id="liveStreamSection"></div>

            <div class="section-title"><i class="fa-solid fa-newspaper"></i> أحدث الأخبار</div>
            <div class="news-grid" id="newsGrid">
                <div class="status-msg">جاري تحميل الأخبار...</div>
            </div>
        </main>

        <aside>
            <div class="sidebar-table-box">
                <div class="section-title" id="tableTitle" style="margin-bottom: 0;"><i class="fa-solid fa-list-ol"></i> ترتيب الفرق</div>
                <div class="table-scroll-container" id="tableScrollContainer"></div>
            </div>
        </aside>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA7hsAeX_BLGnGblG--rWJzJUaaMcrT9kGc",
            authDomain: "abo-zein-kora.firebaseapp.com",
            projectId: "abo-zein-kora",
            storageBucket: "abo-zein-kora.firebasestorage.app",
            messagingSenderId: "528930689485",
            appId: "1:528930689485:web:426749d38cf2e7f8453484"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentCategory = 'local';
        let allNews = [];

        const egyptianTeams = ["الأهلي", "الزمالك", "بيراميدز", "مودرن سبورت", "المصري البورسعيدي", "سموحة", "زد FC", "سيراميكا كليوباترا", "الاتحاد السكندري", "طلائع الجيش", "البنك الأهلي", "الإسماعيلي", "الجونة", "غزل المحلة", "بتروجيت", "حرس الحدود", "فاركو", "إنبي"];
        const saudiTeams = ["الهلال", "النصر", "الأهلي", "الاتحاد", "التعاون", "الشباب", "البروت", "الاتفاق", "ضمك", "الفيحاء", "الفتح", "الرياض", "الوحدة", "الرائد", "العروبة", "القادسية", "الخلود", "الأخدود"];
        const spanishTeams = ["ريال مدريد", "برشلونة", "أتلتيكو مدريد", "أتلتيك بلباو", "جيرونا", "ريال بيتيس", "ريال سوسيداد", "فيلاريال", "فالنسيا", "ختافي", "إشبيلية", "أوساسونا", "سيلتا فيغو", "مايوركا", "لاس بالماس", "رايو فايكانو", "إسبانيول", "بلد الوليد", "ديبورتيفو ألافيس", "سي دي ليغانيس"];

        function renderCategoryData() {
            const streamSec = document.getElementById('liveStreamSection');
            const tableSec = document.getElementById('tableScrollContainer');
            const tableTitle = document.getElementById('tableTitle');

            if (currentCategory === 'local') {
                tableTitle.innerHTML = `<i class="fa-solid fa-list-ol"></i> ترتيب الدوري المصري`;
                streamSec.innerHTML = `
                    <div class="section-title"><i class="fa-solid fa-tv"></i> البث المباشر (الكرة المحلية)</div>
                    <div class="live-streams-grid">
                        <div class="stream-card"><h4>مباراة الأهلي</h4><a href="#" class="live-btn" onclick="alert('جاري تشغيل بث الأهلي')"><i class="fa-solid fa-play"></i> مشاهدة البث</a></div>
                        <div class="stream-card"><h4>مباراة الزمالك</h4><a href="#" class="live-btn" onclick="alert('جاري تشغيل بث الزمالك')"><i class="fa-solid fa-play"></i> مشاهدة البث</a></div>
                        <div class="stream-card"><h4>مباراة بيراميدز</h4><a href="#" class="live-btn" onclick="alert('جاري تشغيل بث بيراميدز')"><i class="fa-solid fa-play"></i> مشاهدة البث</a></div>
                    </div>
                `;

                let rows = egyptianTeams.map((team, idx) => `<tr><td><b>${idx + 1}</b></td><td class="team-name">${team}</td><td>0</td><td><b>0</b></td></tr>`).join('');
                tableSec.innerHTML = `<table class="league-table"><thead><tr><th>#</th><th style="text-align: right;">الفريق</th><th>لعب</th><th>نقاط</th></tr></thead><tbody>${rows}</tbody></table>`;

            } else if (currentCategory === 'saudi') {
                tableTitle.innerHTML = `<i class="fa-solid fa-list-ol"></i> ترتيب الدوري السعودي`;
                streamSec.innerHTML = `
                    <div class="section-title"><i class="fa-solid fa-tv"></i> البث المباشر (الدوري السعودي)</div>
                    <div class="live-streams-grid">
                        <div class="stream-card"><h4>مباراة الهلال</h4><a href="#" class="live-btn" onclick="alert('جاري تشغيل بث الهلال')"><i class="fa-solid fa-play"></i> مشاهدة البث</a></div>
                        <div class="stream-card"><h4>مباراة النصر</h4><a href="#" class="live-btn" onclick="alert('جاري تشغيل بث النصر')"><i class="fa-solid fa-play"></i> مشاهدة البث</a></div>
                        <div class="stream-card"><h4>مباراة الاتحاد</h4><a href="#" class="live-btn" onclick="alert('جاري تشغيل بث الاتحاد')"><i class="fa-solid fa-play"></i> مشاهدة البث</a></div>
                        <div class="stream-card"><h4>مباراة الأهلي</h4><a href="#" class="live-btn" onclick="alert('جاري تشغيل بث الأهلي السعودي')"><i class="fa-solid fa-play"></i> مشاهدة البث</a></div>
                    </div>
                `;

                let rows = saudiTeams.map((team, idx) => `<tr><td><b>${idx + 1}</b></td><td class="team-name">${team}</td><td>0</td><td><b>0</b></td></tr>`).join('');
                tableSec.innerHTML = `<table class="league-table"><thead><tr><th>#</th><th style="text-align: right;">الفريق</th><th>لعب</th><th>نقاط</th></tr></thead><tbody>${rows}</tbody></table>`;

            } else if (currentCategory === 'global') {
                tableTitle.innerHTML = `<i class="fa-solid fa-list-ol"></i> ترتيب الدوري الإسباني`;
                streamSec.innerHTML = '';

                let rows = spanishTeams.map((team, idx) => `<tr><td><b>${idx + 1}</b></td><td class="team-name">${team}</td><td>0</td><td><b>0</b></td></tr>`).join('');
                tableSec.innerHTML = `<table class="league-table"><thead><tr><th>#</th><th style="text-align: right;">الفريق</th><th>لعب</th><th>نقاط</th></tr></thead><tbody>${rows}</tbody></table>`;
            }
        }

        onSnapshot(query(collection(db, "news"), orderBy("date", "desc")), (snapshot) => {
            allNews = [];
            snapshot.forEach((doc) => allNews.push(doc.data()));
            renderNews();
        });

        window.renderNews = function() {
            const grid = document.getElementById('newsGrid');
            grid.innerHTML = '';

            const filtered = allNews.filter(item => item.category === currentCategory);

            if (filtered.length === 0) {
                grid.innerHTML = `<div class="status-msg">لا توجد أخبار مضافة في هذا القسم حتى الآن. يمكنك النشر من لوحة التحكم.</div>`;
                return;
            }

            filtered.forEach(item => {
                grid.innerHTML += `
                    <div class="news-card">
                        <div class="news-img-wrapper">
                            <img src="${item.img}" alt="صورة الخبر">
                        </div>
                        <div class="news-content">
                            <span class="news-tag">${item.categoryName || 'عام'}</span>
                            <h3 class="news-card-title">${item.title}</h3>
                        </div>
                    </div>
                `;
            });
        };

        window.loadCategory = function(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCategoryData();
            renderNews();
        }

        renderCategoryData();
    </script>
</body>
</html>
